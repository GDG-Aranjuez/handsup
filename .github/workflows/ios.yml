name: iOS

# macOS runners are slow and the project's Actions budget is limited, so this runs on demand only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Kotlin domain tests on the iOS simulator
        run: ./gradlew :domain:iosSimulatorArm64Test --console=plain
        working-directory: mobile
      - name: Build the app for the simulator
        run: |
          gem install xcodeproj --no-document
          cd iosApp && ruby generate_project.rb
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
        working-directory: mobile
