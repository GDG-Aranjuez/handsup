name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rules:
    name: Firestore rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: firebase/pnpm-lock.yaml }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: pnpm install --frozen-lockfile
        working-directory: firebase
      - run: pnpm exec firebase emulators:exec --config firebase.test.json --only firestore --project handsup-demo "pnpm exec vitest run"
        working-directory: firebase

  web:
    name: Web (check, unit, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm check
        working-directory: web
      - run: pnpm test
        working-directory: web
      - run: pnpm build
        working-directory: web
        env:
          BASE_PATH: /handsup

  e2e:
    name: Web end to end (emulators)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: pnpm install --frozen-lockfile
        working-directory: firebase
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      # Playwright's global setup seeds the emulators, so they must be up first.
      - run: |
          pnpm exec firebase emulators:exec --project handsup-demo --only auth,firestore \
            "cd ../web && pnpm exec playwright test --project=mobile"
        working-directory: firebase
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results
          retention-days: 7

  kotlin:
    name: Kotlin (domain tests, Android build, strings)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Generated strings are up to date
        run: node tools/gen-kotlin-strings.mjs --check
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Domain tests (JVM)
        run: ./gradlew :domain:jvmTest :composeApp:testAndroidHostTest --console=plain
        working-directory: mobile
      - name: Android debug APK
        run: ./gradlew :androidApp:assembleDebug --console=plain
        working-directory: mobile
      - uses: actions/upload-artifact@v4
        with:
          name: handsup-debug-apk
          path: mobile/androidApp/build/outputs/apk/debug/*.apk
          retention-days: 14
